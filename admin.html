<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechNovaBD Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f1f5f9;
    color:#111827;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:18px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

input,
textarea,
select{
    width:100%;
    padding:14px;
    margin:8px 0 15px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    font-size:16px;
    cursor:pointer;
    margin:5px;
}

.btn-blue{
    background:#2563eb;
    color:white;
}

.btn-green{
    background:#16a34a;
    color:white;
}

.btn-red{
    background:#dc2626;
    color:white;
}

.btn-gray{
    background:#64748b;
    color:white;
}

.hidden{
    display:none !important;
}

.message{
    padding:12px;
    border-radius:10px;
    margin:10px 0;
    background:#e0f2fe;
}

.product,
.order{
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:18px;
    margin-top:15px;
    background:#fafafa;
}

.product img{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:12px;
    display:block;
    margin-bottom:12px;
}

.order{
    background:white;
}

.order-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.address-box{
    background:#f8fafc;
    border-left:5px solid #2563eb;
    padding:15px;
    border-radius:10px;
    line-height:1.8;
    margin:15px 0;
}

.products-box{
    background:#f8fafc;
    padding:15px;
    border-radius:10px;
    margin:15px 0;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    background:#fef3c7;
    color:#92400e;
    font-weight:bold;
}

.price{
    font-size:20px;
    font-weight:bold;
}

.small{
    color:#64748b;
    font-size:14px;
}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .card{
        padding:15px;
    }

    button{
        width:auto;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>🛒 TechNovaBD Admin Panel</h1>


<!-- ================= LOGIN ================= -->

<div id="loginSection" class="card">

    <h2>🔐 Admin Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button
        class="btn-blue"
        onclick="login()"
    >
        Login
    </button>

    <div id="loginMessage"></div>

</div>



<!-- ================= ADMIN ================= -->

<div id="adminSection" class="hidden">


<!-- ================= ADMIN TOP ================= -->

<div class="card">

    <h2>⚙️ Admin Dashboard</h2>

    <button
        class="btn-red"
        onclick="logout()"
    >
        🚪 Logout
    </button>

</div>



<!-- ================= ADD PRODUCT ================= -->

<div class="card">

    <h2 id="productFormTitle">
        ➕ Add Product
    </h2>

    <input
        type="hidden"
        id="productId"
    >

    <label>Product Name</label>

    <input
        type="text"
        id="productName"
        placeholder="Product name"
    >

    <label>Price</label>

    <input
        type="number"
        id="productPrice"
        placeholder="Price"
    >

    <label>Image URL</label>

    <input
        type="text"
        id="productImage"
        placeholder="https://i.ibb.co.com/..."
    >

    <label>Description</label>

    <textarea
        id="productDescription"
        placeholder="Product description"
    ></textarea>

    <button
        class="btn-green"
        onclick="saveProduct()"
    >
        💾 Save Product
    </button>

    <button
        class="btn-gray hidden"
        id="cancelEditBtn"
        onclick="cancelEdit()"
    >
        ❌ Cancel Edit
    </button>

    <div id="productMessage"></div>

</div>



<!-- ================= PRODUCTS ================= -->

<div class="card">

    <h2>📦 Products</h2>

    <button
        class="btn-blue"
        onclick="loadProducts()"
    >
        🔄 Refresh Products
    </button>

    <div id="productsList">
        Loading...
    </div>

</div>



<!-- ================= ORDERS ================= -->

<div class="card">

    <h2>📦 Customer Orders</h2>

    <button
        class="btn-blue"
        onclick="loadOrders()"
    >
        🔄 Refresh Orders
    </button>

    <div id="ordersList">
        Loading...
    </div>

</div>


</div>

</div>



<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://dcmeprqtygptljxjnbku.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UQ_deuuX94nqT77envaRJg_VZXMhZqC";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    if(!email || !password){

        message.innerHTML =
        "<div class='message'>⚠️ Email ও Password দিন</div>";

        return;
    }

    message.innerHTML =
    "<div class='message'>⏳ Login হচ্ছে...</div>";

    try{

        const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,
            password: password

        });

        if(error){

            throw error;

        }

        message.innerHTML = "";

        document
        .getElementById("loginSection")
        .classList.add("hidden");

        document
        .getElementById("adminSection")
        .classList.remove("hidden");

        loadProducts();
        loadOrders();

    }

    catch(error){

        console.error(error);

        message.innerHTML =
        "<div class='message'>❌ Login failed: "
        + escapeHtml(error.message)
        + "</div>";

    }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    document
    .getElementById("adminSection")
    .classList.add("hidden");

    document
    .getElementById("loginSection")
    .classList.remove("hidden");

}


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkLogin(){

    const {
        data: { session }
    } =
    await supabaseClient.auth.getSession();

    if(session){

        document
        .getElementById("loginSection")
        .classList.add("hidden");

        document
        .getElementById("adminSection")
        .classList.remove("hidden");

        loadProducts();
        loadOrders();

    }

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(){

    const id =
        document.getElementById("productId").value;

    const name =
        document.getElementById("productName").value.trim();

    const price =
        Number(
            document.getElementById("productPrice").value
        );

    const image =
        document.getElementById("productImage").value.trim();

    const description =
        document.getElementById("productDescription").value.trim();

    const message =
        document.getElementById("productMessage");


    if(!name){

        message.innerHTML =
        "<div class='message'>⚠️ Product Name দিন</div>";

        return;
    }

    if(!price || price <= 0){

        message.innerHTML =
        "<div class='message'>⚠️ সঠিক Price দিন</div>";

        return;
    }


    message.innerHTML =
    "<div class='message'>⏳ Saving...</div>";


    try{

        let result;


        /* EDIT */

        if(id){

            result =
            await supabaseClient
            .from("products")
            .update({

                name: name,
                price: price,
                image: image,
                description: description

            })
            .eq("id", id);

        }


        /* ADD */

        else{

            result =
            await supabaseClient
            .from("products")
            .insert({

                name: name,
                price: price,
                image: image,
                description: description

            });

        }


        if(result.error){

            throw result.error;

        }


        message.innerHTML =
        "<div class='message'>✅ Product successfully saved!</div>";

        cancelEdit();

        loadProducts();

    }

    catch(error){

        console.error(error);

        message.innerHTML =
        "<div class='message'>❌ Error: "
        + escapeHtml(error.message)
        + "</div>";

    }

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const list =
        document.getElementById("productsList");

    list.innerHTML =
    "<p>⏳ Loading products...</p>";


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("products")
        .select("*")
        .order("id", { ascending:false });


        if(error){

            throw error;

        }


        if(!data || data.length === 0){

            list.innerHTML =
            "<p>📦 কোনো Product নেই।</p>";

            return;
        }


        list.innerHTML = "";


        data.forEach(product => {

            const div =
            document.createElement("div");

            div.className = "product";


            div.innerHTML = `

                ${
                    product.image
                    ?
                    `<img
                        src="${escapeAttribute(product.image)}"
                        onerror="this.style.display='none'"
                    >`
                    :
                    ""
                }

                <h3>
                    ${escapeHtml(product.name || "Unnamed Product")}
                </h3>

                <p class="price">
                    💰 ৳${Number(product.price || 0).toFixed(2)}
                </p>

                <p>
                    ${escapeHtml(product.description || "")}
                </p>

                <button
                    class="btn-blue"
                    onclick='editProduct(${JSON.stringify(product).replace(/'/g,"&#39;")})'
                >
                    ✏️ Edit
                </button>

                <button
                    class="btn-red"
                    onclick="deleteProduct('${escapeAttribute(product.id)}')"
                >
                    🗑️ Delete
                </button>

            `;


            list.appendChild(div);

        });

    }

    catch(error){

        console.error(error);

        list.innerHTML =
        "<div class='message'>❌ Products load failed: "
        + escapeHtml(error.message)
        + "</div>";

    }

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(product){

    document
    .getElementById("productId")
    .value = product.id || "";

    document
    .getElementById("productName")
    .value = product.name || "";

    document
    .getElementById("productPrice")
    .value = product.price || "";

    document
    .getElementById("productImage")
    .value = product.image || "";

    document
    .getElementById("productDescription")
    .value = product.description || "";


    document
    .getElementById("productFormTitle")
    .innerText = "✏️ Edit Product";


    document
    .getElementById("cancelEditBtn")
    .classList.remove("hidden");


    window.scrollTo({

        top:0,
        behavior:"smooth"

    });

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit(){

    document
    .getElementById("productId")
    .value = "";

    document
    .getElementById("productName")
    .value = "";

    document
    .getElementById("productPrice")
    .value = "";

    document
    .getElementById("productImage")
    .value = "";

    document
    .getElementById("productDescription")
    .value = "";


    document
    .getElementById("productFormTitle")
    .innerText = "➕ Add Product";


    document
    .getElementById("cancelEditBtn")
    .classList.add("hidden");

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

    if(!confirm("এই Product টি Delete করতে চান?")){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


        if(error){

            throw error;

        }


        alert("✅ Product deleted successfully!");

        loadProducts();

    }

    catch(error){

        console.error(error);

        alert(
            "❌ Delete failed: "
            + error.message
        );

    }

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

    const list =
        document.getElementById("ordersList");

    list.innerHTML =
    "<p>⏳ Loading orders...</p>";


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", {
            ascending:false
        });


        if(error){

            throw error;

        }


        if(!data || data.length === 0){

            list.innerHTML =
            "<p>📦 এখনো কোনো Order নেই।</p>";

            return;

        }


        list.innerHTML = "";


        data.forEach(order => {

            const div =
            document.createElement("div");

            div.className = "order";


            /* PRODUCTS */

            let productsHTML = "";


            if(Array.isArray(order.products)){

                order.products.forEach(item => {

                    productsHTML += `

                        <div style="
                            padding:10px;
                            border-bottom:1px solid #e5e7eb;
                        ">

                            🛍️
                            ${escapeHtml(item.name || "Product")}

                            × ${Number(item.quantity || 1)}

                            — ৳${Number(item.price || 0).toFixed(2)}

                        </div>

                    `;

                });

            }

            else if(typeof order.products === "string"){

                productsHTML =
                escapeHtml(order.products);

            }

            else{

                productsHTML =
                "No product information";

            }


            /* FULL ADDRESS */

            const division =
                order.division || "";

            const district =
                order.district || "";

            const upazila =
                order.upazila || "";

            const village =
                order.village || "";

            const detailsAddress =
                order.details_address || "";


            let addressHTML = "";


            if(division){

                addressHTML +=
                `<div>🏢 <b>বিভাগ:</b> ${escapeHtml(division)}</div>`;

            }


            if(district){

                addressHTML +=
                `<div>📍 <b>জেলা:</b> ${escapeHtml(district)}</div>`;

            }


            if(upazila){

                addressHTML +=
                `<div>🏠 <b>উপজেলা/থানা:</b> ${escapeHtml(upazila)}</div>`;

            }


            if(village){

                addressHTML +=
                `<div>📌 <b>গ্রাম/এলাকা:</b> ${escapeHtml(village)}</div>`;

            }


            if(detailsAddress){

                addressHTML +=
                `<div>📝 <b>বিস্তারিত:</b> ${escapeHtml(detailsAddress)}</div>`;

            }


            if(!addressHTML){

                addressHTML =
                "<span style='color:#dc2626'>⚠️ ঠিকানা দেওয়া হয়নি</span>";

            }


            /* DATE */

            let dateText = "";

            if(order.created_at){

                const date =
                new Date(order.created_at);

                dateText =
                date.toLocaleString(
                    "bn-BD",
                    {
                        dateStyle:"medium",
                        timeStyle:"short"
                    }
                );

            }


            /* STATUS */

            const currentStatus =
                order.status || "Pending";


            div.innerHTML = `

                <div class="order-title">

                    📦 Order:
                    ${escapeHtml(
                        order.order_id ||
                        order.id ||
                        "Unknown"
                    )}

                </div>


                <div>

                    👤 <b>নাম:</b>
                    ${escapeHtml(
                        order.customer_name ||
                        order.name ||
                        ""
                    )}

                </div>


                <div style="margin-top:8px">

                    📞 <b>Phone:</b>
                    ${escapeHtml(
                        order.phone || ""
                    )}

                </div>


                <div class="address-box">

                    <div style="
                        font-size:19px;
                        margin-bottom:8px;
                    ">

                        📍 <b>Address</b>

                    </div>

                    ${addressHTML}

                </div>


                <div class="products-box">

                    <h3>🛍️ Products</h3>

                    ${productsHTML}

                </div>


                <p class="price">

                    💰 Total:
                    ৳${Number(
                        order.total || 0
                    ).toFixed(2)}

                </p>


                ${
                    order.delivery_charge !== undefined
                    ?
                    `
                    <p>
                        🚚 Delivery Charge:
                        ৳${Number(
                            order.delivery_charge || 0
                        ).toFixed(2)}
                    </p>
                    `
                    :
                    ""
                }


                ${
                    order.product_total !== undefined
                    ?
                    `
                    <p>
                        🛒 Product Total:
                        ৳${Number(
                            order.product_total || 0
                        ).toFixed(2)}
                    </p>
                    `
                    :
                    ""
                }


                <p>

                    📅 ${escapeHtml(dateText)}

                </p>


                <p>

                    Status:

                    <span class="status">

                        ${escapeHtml(currentStatus)}

                    </span>

                </p>


                <select
                    id="status-${escapeAttribute(order.id)}"
                >

                    <option
                        value="Pending"
                        ${currentStatus === "Pending" ? "selected" : ""}
                    >
                        Pending
                    </option>

                    <option
                        value="Confirmed"
                        ${currentStatus === "Confirmed" ? "selected" : ""}
                    >
                        Confirmed
                    </option>

                    <option
                        value="Processing"
                        ${currentStatus === "Processing" ? "selected" : ""}
                    >
                        Processing
                    </option>

                    <option
                        value="Shipped"
                        ${currentStatus === "Shipped" ? "selected" : ""}
                    >
                        Shipped
                    </option>

                    <option
                        value="Delivered"
                        ${currentStatus === "Delivered" ? "selected" : ""}
                    >
                        Delivered
                    </option>

                    <option
                        value="Cancelled"
                        ${currentStatus === "Cancelled" ? "selected" : ""}
                    >
                        Cancelled
                    </option>

                </select>


                <button
                    class="btn-green"
                    onclick="updateOrderStatus('${escapeAttribute(order.id)}')"
                >
                    💾 Update Status
                </button>

            `;


            list.appendChild(div);

        });

    }

    catch(error){

        console.error(error);

        list.innerHTML =
        "<div class='message'>❌ Orders load failed: "
        + escapeHtml(error.message)
        + "</div>";

    }

}


/* =====================================================
   UPDATE ORDER STATUS
===================================================== */

async function updateOrderStatus(id){

    const select =
        document.getElementById(
            "status-" + id
        );


    if(!select){

        return;

    }


    const newStatus =
        select.value;


    try{

        const {
            error
        } =
        await supabaseClient
        .from("orders")
        .update({

            status:newStatus

        })
        .eq("id",id);


        if(error){

            throw error;

        }


        alert(
            "✅ Status updated!"
        );


        loadOrders();

    }

    catch(error){

        console.error(error);

        alert(
            "❌ Status update failed: "
            + error.message
        );

    }

}


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =====================================================
   START
===================================================== */

checkLogin();

</script>

</body>
</html>
