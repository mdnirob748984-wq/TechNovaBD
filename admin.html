<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechNovaBD Admin Panel</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:22px}
button{border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-size:15px}
button:disabled{opacity:.6}
.container{max-width:1100px;margin:25px auto;padding:0 15px}
.login-box,.panel{background:white;padding:22px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:25px}
.login-box{max-width:420px;margin:70px auto}
h2{margin-top:0}
input,textarea,select{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #d1d5db;border-radius:7px;font-size:15px}
textarea{min-height:100px;resize:vertical}
.primary-btn{background:#2563eb;color:white}
.success-btn{background:#16a34a;color:white}
.danger-btn{background:#dc2626;color:white}
.gray-btn{background:#6b7280;color:white}
.logout-btn{background:#ef4444;color:white}
.message{padding:12px;border-radius:7px;margin:10px 0;display:none;word-break:break-word}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.info{background:#dbeafe;color:#1e40af}
.product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.product-card,.order-card{border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-top:15px;background:#fafafa}
.product-card img{width:100%;height:180px;object-fit:contain;background:white;border-radius:8px;margin-bottom:10px}
.price{font-size:19px;font-weight:bold;color:#16a34a}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hidden{display:none!important}
.top-actions{display:flex;gap:10px;margin-bottom:15px}
.order-products{background:white;padding:10px;border-radius:7px;margin-top:10px}
.status{padding:5px 9px;border-radius:20px;background:#fef3c7;color:#92400e;display:inline-block;font-size:13px}
.loading,.empty{text-align:center;padding:20px;color:#6b7280}

@media(max-width:600px){
header{flex-direction:column;align-items:stretch;gap:10px}
.logout-btn{width:100%}
.login-box{margin:30px 15px}
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginSection">

<div class="login-box">

<h2>🔐 TechNovaBD Admin Login</h2>

<label>Admin Email</label>

<input
type="email"
id="email"
placeholder="Admin Email"
autocomplete="email"
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password"
>

<button
id="loginBtn"
class="primary-btn"
style="width:100%;"
onclick="login()"
>
🔐 Login
</button>

<div id="loginMessage" class="message"></div>

</div>

</div>


<!-- ADMIN -->

<div id="adminSection" class="hidden">

<header>

<h1>🛒 TechNovaBD Admin Panel</h1>

<button class="logout-btn" onclick="logout()">
🚪 Logout
</button>

</header>


<div class="container">

<!-- ADD PRODUCT -->

<div class="panel">

<h2 id="productFormTitle">➕ Add Product</h2>

<label>Product Name</label>

<input
type="text"
id="productName"
placeholder="যেমন: Wireless Microphone"
>

<label>Price (৳)</label>

<input
type="number"
id="productPrice"
placeholder="1499"
min="0"
step="0.01"
>

<label>Product Image URL</label>

<input
type="url"
id="productImage"
placeholder="https://example.com/image.jpg"
>

<label>Description</label>

<textarea
id="productDescription"
placeholder="Product সম্পর্কে বিস্তারিত লিখুন..."
></textarea>

<div class="actions">

<button
id="saveProductBtn"
class="success-btn"
onclick="saveProduct()"
>
➕ Add Product
</button>

<button
id="cancelEditBtn"
class="gray-btn hidden"
onclick="cancelEdit()"
>
❌ Cancel Edit
</button>

</div>

<div id="productMessage" class="message"></div>

</div>


<!-- PRODUCTS -->

<div class="panel">

<h2>🛍️ Manage Products</h2>

<div class="top-actions">

<button
class="primary-btn"
onclick="loadProducts()"
>
🔄 Refresh Products
</button>

</div>

<div id="productsList">
<div class="loading">Products loading...</div>
</div>

</div>


<!-- ORDERS -->

<div class="panel">

<h2>📦 Customer Orders</h2>

<div class="top-actions">

<button
class="primary-btn"
onclick="loadOrders()"
>
🔄 Refresh Orders
</button>

</div>

<div id="ordersList">
<div class="loading">Orders loading...</div>
</div>

</div>

</div>
</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://dcmeprqtygptljxjnbku.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UQ_deuuX94nqT77envaRJg_VZXMhZqC";

let accessToken = null;
let editingProductId = null;


/* MESSAGE */

function showMessage(id,text,type){

const el=document.getElementById(id);

el.innerHTML=text;
el.className="message "+type;
el.style.display="block";

}

function hideMessage(id){

const el=document.getElementById(id);

if(el) el.style.display="none";

}


/* LOGIN */

async function login(){

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;

const loginBtn=
document.getElementById("loginBtn");

if(!email || !password){

showMessage(
"loginMessage",
"❌ Email এবং Password দিন।",
"error"
);

return;
}

try{

loginBtn.disabled=true;
loginBtn.innerText="⏳ Login হচ্ছে...";

showMessage(
"loginMessage",
"⏳ Login হচ্ছে...",
"info"
);

const response=await fetch(
SUPABASE_URL+
"/auth/v1/token?grant_type=password",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},

body:JSON.stringify({
email:email,
password:password
})
}
);

const data=await response.json();

console.log("SUPABASE LOGIN:",data);

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
data.message ||
"Invalid login credentials"
);

}

if(!data.access_token){

throw new Error(
"Access token পাওয়া যায়নি।"
);

}

accessToken=data.access_token;

localStorage.setItem(
"technovabd_access_token",
accessToken
);

document
.getElementById("loginSection")
.classList.add("hidden");

document
.getElementById("adminSection")
.classList.remove("hidden");

hideMessage("loginMessage");

await loadProducts();
await loadOrders();

}

catch(error){

console.error("LOGIN ERROR:",error);

showMessage(
"loginMessage",
"❌ Login করা যায়নি।<br><br>"+
"<strong>Error:</strong><br>"+
escapeHtml(error.message),
"error"
);

}

finally{

loginBtn.disabled=false;
loginBtn.innerText="🔐 Login";

}

}


/* LOGOUT */

function logout(){

accessToken=null;

localStorage.removeItem(
"technovabd_access_token"
);

document
.getElementById("adminSection")
.classList.add("hidden");

document
.getElementById("loginSection")
.classList.remove("hidden");

document.getElementById("email").value="";
document.getElementById("password").value="";

}


/* SAVED LOGIN */

function checkSavedSession(){

const token=
localStorage.getItem(
"technovabd_access_token"
);

if(!token)return;

accessToken=token;

document
.getElementById("loginSection")
.classList.add("hidden");

document
.getElementById("adminSection")
.classList.remove("hidden");

loadProducts();
loadOrders();

}


/* AUTH HEADERS */

function authHeaders(){

return{

"Content-Type":"application/json",

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+accessToken

};

}


/* SAVE PRODUCT */

async function saveProduct(){

const name=
document.getElementById("productName")
.value.trim();

const priceValue=
document.getElementById("productPrice")
.value.trim();

const image=
document.getElementById("productImage")
.value.trim();

const description=
document.getElementById("productDescription")
.value.trim();

if(!name){

showMessage(
"productMessage",
"❌ Product Name দিন।",
"error"
);

return;

}

if(!priceValue){

showMessage(
"productMessage",
"❌ Price দিন।",
"error"
);

return;

}

const price=Number(priceValue);

if(!Number.isFinite(price)||price<0){

showMessage(
"productMessage",
"❌ সঠিক Price দিন।",
"error"
);

return;

}

const product={
name:name,
price:price,
image:image,
description:description
};

const btn=
document.getElementById("saveProductBtn");

try{

btn.disabled=true;
btn.innerText="⏳ Saving...";

let response;

if(editingProductId!==null){

response=await fetch(
SUPABASE_URL+
"/rest/v1/products?id=eq."+
encodeURIComponent(editingProductId),
{
method:"PATCH",
headers:{
...authHeaders(),
"Prefer":"return=minimal"
},
body:JSON.stringify(product)
}
);

}else{

response=await fetch(
SUPABASE_URL+
"/rest/v1/products",
{
method:"POST",
headers:{
...authHeaders(),
"Prefer":"return=minimal"
},
body:JSON.stringify(product)
}
);

}

if(!response.ok){

throw new Error(
await response.text()
);

}

showMessage(
"productMessage",
editingProductId!==null
?"✅ Product Update হয়েছে।"
:"✅ Product Add হয়েছে।",
"success"
);

clearProductForm();

await loadProducts();

}

catch(error){

console.error(error);

showMessage(
"productMessage",
"❌ Product Save করা যায়নি।<br><br>"+
escapeHtml(error.message),
"error"
);

}

finally{

btn.disabled=false;

btn.innerText=
editingProductId!==null
?"💾 Update Product"
:"➕ Add Product";

}

}


/* LOAD PRODUCTS */

async function loadProducts(){

const container=
document.getElementById("productsList");

container.innerHTML=
'<div class="loading">⏳ Products loading...</div>';

if(!accessToken){

container.innerHTML=
'<div class="message error" style="display:block">❌ আগে Login করুন।</div>';

return;

}

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/products?select=*&order=created_at.desc",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+accessToken
}
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

const products=await response.json();

if(!products.length){

container.innerHTML=
'<div class="empty">🛍️ এখনো কোনো Product নেই।</div>';

return;

}

container.innerHTML=
'<div class="product-grid"></div>';

const grid=
container.querySelector(".product-grid");

products.forEach(product=>{

const card=
document.createElement("div");

card.className="product-card";

const image=
product.image ||
"https://via.placeholder.com/400x300?text=No+Image";

card.innerHTML=`

<img
src="${escapeHtml(image)}"
alt="${escapeHtml(product.name||"")}"
onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'"
>

<h3>
${escapeHtml(product.name||"")}
</h3>

<div class="price">
৳${Number(product.price||0).toFixed(2)}
</div>

<p>
${escapeHtml(product.description||"")}
</p>

<div class="actions">

<button
class="primary-btn"
onclick="editProduct('${escapeJs(product.id)}')"
>
✏️ Edit
</button>

<button
class="danger-btn"
onclick="deleteProduct('${escapeJs(product.id)}')"
>
🗑️ Delete
</button>

</div>
`;

grid.appendChild(card);

});

}

catch(error){

console.error(error);

container.innerHTML=`

<div
class="message error"
style="display:block"
>

❌ Products load করা যায়নি।

<br><br>

<strong>Error:</strong><br>

${escapeHtml(error.message)}

</div>

`;

}

}


/* EDIT PRODUCT */

async function editProduct(id){

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/products?id=eq."+
encodeURIComponent(id)+
"&select=*",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+accessToken
}
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

const products=await response.json();

if(!products.length){

alert("❌ Product পাওয়া যায়নি।");

return;

}

const product=products[0];

document.getElementById("productName").value=
product.name||"";

document.getElementById("productPrice").value=
product.price??"";

document.getElementById("productImage").value=
product.image||"";

document.getElementById("productDescription").value=
product.description||"";

editingProductId=id;

document.getElementById("productFormTitle")
.innerText="✏️ Edit Product";

document.getElementById("saveProductBtn")
.innerText="💾 Update Product";

document.getElementById("cancelEditBtn")
.classList.remove("hidden");

window.scrollTo({
top:0,
behavior:"smooth"
});

}

catch(error){

alert(
"❌ Product load করা যায়নি.\n\n"+
error.message
);

}

}


/* CANCEL EDIT */

function cancelEdit(){

clearProductForm();

}


/* CLEAR FORM */

function clearProductForm(){

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productImage").value="";
document.getElementById("productDescription").value="";

editingProductId=null;

document.getElementById("productFormTitle")
.innerText="➕ Add Product";

document.getElementById("saveProductBtn")
.innerText="➕ Add Product";

document.getElementById("cancelEditBtn")
.classList.add("hidden");

}


/* DELETE PRODUCT */

async function deleteProduct(id){

if(!confirm(
"আপনি কি সত্যিই এই Product Delete করতে চান?"
))return;

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/products?id=eq."+
encodeURIComponent(id),
{
method:"DELETE",
headers:{
...authHeaders(),
"Prefer":"return=minimal"
}
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

alert("✅ Product Delete হয়েছে।");

await loadProducts();

}

catch(error){

alert(
"❌ Delete করা যায়নি.\n\n"+
error.message
);

}

}


/* LOAD ORDERS */

async function loadOrders(){

const container=
document.getElementById("ordersList");

container.innerHTML=
'<div class="loading">⏳ Orders loading...</div>';

if(!accessToken){

container.innerHTML=
'<div class="message error" style="display:block">❌ আগে Login করুন।</div>';

return;

}

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/orders?select=*&order=created_at.desc",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+accessToken
}
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

const orders=await response.json();

if(!orders.length){

container.innerHTML=
'<div class="empty">📦 এখনো কোনো Order নেই।</div>';

return;

}

container.innerHTML="";

orders.forEach(order=>{

const card=
document.createElement("div");

card.className="order-card";

let productText="";

if(Array.isArray(order.products)){

order.products.forEach(item=>{

productText+=`

<div>

🛍️ ${escapeHtml(item.name||"")}

× ${escapeHtml(item.quantity??1)}

— ৳${escapeHtml(item.price??0)}

</div>

`;

});

}else{

productText="Product information নেই।";

}

const orderId=
String(order.order_id||"");

const safeOrderId=
escapeJs(orderId);

card.innerHTML=`

<h3>
📦 Order: ${escapeHtml(orderId)}
</h3>

<p>
👤 <strong>নাম:</strong>
${escapeHtml(order.customer_name||"")}
</p>

<p>
📞 <strong>Phone:</strong>
${escapeHtml(order.phone||"")}
</p>

<p>
📍 <strong>Address:</strong>
${escapeHtml(order.address||"")}
</p>

<div class="order-products">

<strong>Products:</strong>

<br><br>

${productText}

</div>

<p>
💰 <strong>Total:</strong>
৳${Number(order.total||0).toFixed(2)}
</p>

<p>
📅 ${formatDate(order.created_at)}
</p>

<p>

Status:

<span class="status">
${escapeHtml(order.status||"Pending")}
</span>

</p>

<div class="actions">

<select id="status-${safeOrderId}">

<option value="Pending"
${order.status==="Pending"?"selected":""}>
Pending
</option>

<option value="Confirmed"
${order.status==="Confirmed"?"selected":""}>
Confirmed
</option>

<option value="Processing"
${order.status==="Processing"?"selected":""}>
Processing
</option>

<option value="Shipped"
${order.status==="Shipped"?"selected":""}>
Shipped
</option>

<option value="Delivered"
${order.status==="Delivered"?"selected":""}>
Delivered
</option>

<option value="Cancelled"
${order.status==="Cancelled"?"selected":""}>
Cancelled
</option>

</select>

<button
class="success-btn"
onclick="updateStatus('${safeOrderId}')"
>
💾 Update Status
</button>

</div>

`;

container.appendChild(card);

});

}

catch(error){

console.error(error);

container.innerHTML=`

<div
class="message error"
style="display:block"
>

❌ Orders load করা যায়নি।

<br><br>

<strong>Error:</strong><br>

${escapeHtml(error.message)}

</div>

`;

}

}


/* UPDATE ORDER STATUS */

async function updateStatus(orderId){

const select=
document.getElementById(
"status-"+orderId
);

if(!select)return;

const status=select.value;

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/orders?order_id=eq."+
encodeURIComponent(orderId),
{
method:"PATCH",

headers:{
...authHeaders(),
"Prefer":"return=minimal"
},

body:JSON.stringify({
status:status
})
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

alert(
"✅ Order status update হয়েছে।"
);

await loadOrders();

}

catch(error){

alert(
"❌ Status update করা যায়নি.\n\n"+
error.message
);

}

}


/* DATE */

function formatDate(date){

if(!date)return"";

return new Date(date)
.toLocaleString("bn-BD");

}


/* SECURITY */

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeJs(value){

return String(value??"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,'\\"')
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}


/* ENTER TO LOGIN */

document
.getElementById("password")
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){
login();
}

}
);


/* START */

checkSavedSession();

</script>

</body>
</html>
