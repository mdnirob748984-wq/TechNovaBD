<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - TechNovaBD</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.12);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            line-height: 1.6;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }

        .back a {
            color: #555;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="register-box">

    <div class="logo">
        TechNovaBD
    </div>

    <h2>
        Create Account
    </h2>


    <form id="registerForm">


        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="আপনার নাম"
            autocomplete="name"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="আপনার Email"
            autocomplete="email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="কমপক্ষে 6 অক্ষর"
            autocomplete="new-password"
            minlength="6"
            required
        >


        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Password আবার লিখুন"
            autocomplete="new-password"
            minlength="6"
            required
        >


        <button
            type="submit"
            id="registerButton"
        >
            Register
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="login">

        আগে থেকেই Account আছে?

        <a href="login.html">
            Login করুন
        </a>

    </div>


    <div class="back">

        <a href="index.html">
            ← Home Page
        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://dcmeprqtygptljxjnbku.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UQ_deuuX94nqT77envaRJg_VZXMhZqC";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById(
        "registerForm"
    );

const message =
    document.getElementById(
        "message"
    );

const button =
    document.getElementById(
        "registerButton"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("name")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const confirmPassword =
            document
                .getElementById(
                    "confirmPassword"
                )
                .value;


        if (!name) {

            message.textContent =
                "❌ আপনার নাম লিখুন।";

            return;
        }


        if (password.length < 6) {

            message.textContent =
                "❌ Password কমপক্ষে 6 অক্ষরের হতে হবে।";

            return;
        }


        if (password !== confirmPassword) {

            message.textContent =
                "❌ Password দুটো একই নয়।";

            return;
        }


        button.disabled = true;

        message.textContent =
            "⏳ Account তৈরি হচ্ছে...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {
                                name: name
                            },

                            emailRedirectTo:
                                window.location.origin +
                                "/login.html"

                        }

                    });


            if (error) {
                throw error;
            }


            /*
             * Email confirmation ON থাকলে
             * session null হতে পারে।
             */

            if (data.session) {

                message.textContent =
                    "✅ Account তৈরি হয়েছে!";


                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 1000);


            } else {

                message.innerHTML =
                    `
                    ✅ Account তৈরি হয়েছে!<br>
                    আপনার Email inbox দেখুন এবং
                    verification সম্পন্ন করুন।<br>
                    তারপর Login করুন।
                    `;

            }


        } catch (error) {

            console.error(
                "Register Error:",
                error
            );


            message.textContent =
                "❌ " +
                (
                    error.message ||
                    "Registration failed"
                );


        } finally {

            button.disabled = false;

        }

    }
);

</script>

</body>
</html>
