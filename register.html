<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - TechNovaBD</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.12);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
        }

        button:disabled {
            opacity: .6;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        TechNovaBD
    </div>

    <h2>Create Account</h2>

    <form id="registerForm">

        <label>Name</label>

        <input
            type="text"
            id="name"
            placeholder="আপনার নাম"
            required
        >

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="আপনার Email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="কমপক্ষে ৮ অক্ষর"
            minlength="8"
            required
        >

        <button
            type="submit"
            id="registerButton">
            Register
        </button>

    </form>

    <div id="message"></div>

    <div class="login">
        আগে থেকেই Account আছে?
        <a href="login.html">
            Login করুন
        </a>
    </div>

</div>

<script>

const API = "http://localhost:3000/api";

const form =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");

const button =
    document.getElementById("registerButton");


form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    message.textContent =
        "Account তৈরি হচ্ছে...";

    button.disabled = true;

    try {

        const response = await fetch(
            API + "/auth/register",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Registration failed"
            );
        }

        message.textContent =
            "✅ Account সফলভাবে তৈরি হয়েছে!";

        setTimeout(() => {

            window.location.href =
                "login.html";

        }, 1200);

    } catch (error) {

        message.textContent =
            "❌ " + error.message;

    } finally {

        button.disabled = false;

    }

});

</script>

</body>
</html>
